services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dionysus}
      POSTGRES_USER: ${POSTGRES_USER:-dionysus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dionysus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: ${WHISPER_ENGINE:-faster_whisper}
    volumes:
      - whisper_cache:/root/.cache

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - valkey_data:/data

  backend:
    profiles: [production]
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: Host=db;Port=5432;Database=${POSTGRES_DB:-dionysus};Username=${POSTGRES_USER:-dionysus};Password=${POSTGRES_PASSWORD:-dionysus}
      VALKEY_CONNECTION: valkey:6379
      JWT_KEY: ${JWT_KEY}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER}
      YANDEX_AI_API_KEY: ${YANDEX_AI_API_KEY}
      YANDEX_AI_FOLDER_ID: ${YANDEX_AI_FOLDER_ID}
      YANDEX_AI_MODEL: ${YANDEX_AI_MODEL}
      WHISPER_URL: http://whisper:9000
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
      valkey:
        condition: service_healthy

  backend-dev:
    profiles: [dev]
    build:
      context: ./backend
      target: development
      network: host
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DATABASE_URL: Host=db;Port=5432;Database=${POSTGRES_DB:-dionysus};Username=${POSTGRES_USER:-dionysus};Password=${POSTGRES_PASSWORD:-dionysus}
      VALKEY_CONNECTION: valkey:6379
      JWT_KEY: ${JWT_KEY}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER}
      YANDEX_AI_API_KEY: ${YANDEX_AI_API_KEY}
      YANDEX_AI_FOLDER_ID: ${YANDEX_AI_FOLDER_ID}
      YANDEX_AI_MODEL: ${YANDEX_AI_MODEL}
      WHISPER_URL: http://whisper:9000
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - ./backend:/src
      - backend_nuget:/root/.nuget/packages
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
      valkey:
        condition: service_healthy

  frontend:
    profiles: [production]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - backend

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend-dev:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend-dev

volumes:
  backend_nuget:
  frontend_node_modules:
  postgres_data:
  whisper_cache:
  valkey_data:
